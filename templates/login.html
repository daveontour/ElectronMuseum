<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Museum — Sign In</title>
    <link rel="stylesheet" href="/static/css/museum_of.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f1922;
            font-family: inherit;
        }
        .login-card input,
        .login-card button,
        .login-card textarea,
        .login-card select,
        .login-card label {
            font-family: inherit;
        }
        .login-card {
            background: #19264d;
            border-radius: 12px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-title {
            color: #fff;
            margin: 0 0 8px;
            font-size: 1.8rem;
        }
        .login-subtitle {
            color: #8fa4c8;
            margin: 0 0 28px;
            font-size: 0.95rem;
        }
        .tab-row {
            display: flex;
            margin-bottom: 28px;
            border-bottom: 1px solid #2a3a6b;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #8fa4c8;
            font-size: 1rem;
            padding: 8px 20px 10px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: #3b82f6;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            color: #cdd6e8;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #2e4068;
            background: #0f1922;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
        }
        .submit-btn:hover {
            background: #2563eb;
        }
        .submit-btn:disabled {
            background: #1e3a6b;
            cursor: not-allowed;
        }
        .error-msg {
            display: none;
            color: #f87171;
            margin-bottom: 16px;
            font-size: 0.9rem;
            padding: 10px 14px;
            background: rgba(248,113,113,0.1);
            border-radius: 6px;
            border: 1px solid rgba(248,113,113,0.25);
        }
        .panel { display: none; }
        .panel.active { display: block; }
        #login-admin-login-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 100;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2e4068;
            background: #19264d;
            color: #cdd6e8;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        #login-admin-login-btn:hover {
            background: #243368;
            border-color: #3b82f6;
            color: #fff;
        }
        @media (max-width: 640px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <button type="button" id="login-admin-login-btn" style="display:none;">Admin Login</button>
    <div class="login-card">
        <h1 class="login-title"><i class="fas fa-landmark" style="margin-right:10px; color:#3b82f6;"></i>Digital Museum</h1>
        <p class="login-subtitle">Sign in to access the archive.</p>

        <div class="tab-row">
            <button class="tab-btn active" id="tab-login" type="button">Sign In</button>
            <button class="tab-btn" id="tab-register" type="button">Register</button>
            <button class="tab-btn" id="tab-visitor" type="button">Visitor</button>
        </div>

        <div id="error-msg" class="error-msg"></div>
        <div id="success-msg" style="display:none; color:#4ade80; background:rgba(74,222,128,0.1); border:1px solid rgba(74,222,128,0.25); padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:0.9rem;"></div>

        <div id="advanced-trigger" style="text-align:right; margin-bottom:4px;">
            <button type="button" id="advanced-btn" title="Show or hide advanced options" aria-expanded="false" style="background:none;border:none;color:#8fa4c8;font-size:0.82rem;cursor:pointer;padding:2px 0;">&#9881; Advanced</button>
        </div>

        <div id="panel-advanced" style="display:none; margin-bottom:16px; padding:14px; background:#0f1922; border:1px solid #2e4068; border-radius:8px;">
            <div style="color:#cdd6e8; font-size:0.88rem; font-weight:600; margin-bottom:8px;">Database</div>
            <div id="adv-current-path" style="color:#8fa4c8; font-size:0.82rem; margin-bottom:10px; word-break:break-all;">(loading&hellip;)</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <button type="button" id="adv-browse-btn" style="padding:7px 12px; border-radius:6px; border:1px solid #2e4068; background:#0f1922; color:#8fa4c8; cursor:pointer; font-size:0.82rem;">Browse&hellip;</button>
                <button type="button" id="adv-new-btn"    style="padding:7px 12px; border-radius:6px; border:1px solid #2e4068; background:#0f1922; color:#8fa4c8; cursor:pointer; font-size:0.82rem;">New Database&hellip;</button>
                <button type="button" id="adv-apply-btn" disabled style="padding:7px 14px; width:148px; border-radius:6px; border:none; background:#3b82f6; color:#fff; cursor:not-allowed; opacity:0.45; font-size:0.82rem; margin-left:auto; text-align:center;">Use This Database</button>
            </div>

            <div style="margin-top:12px; padding-top:12px; border-top:1px solid #2e4068; display:flex; align-items:center; gap:10px;">
                <span style="color:#cdd6e8; font-size:0.88rem; font-weight:600; white-space:nowrap;">Log Level</span>
                <select id="adv-log-level" style="padding:6px 10px; border-radius:6px; border:1px solid #2e4068; background:#19264d; color:#cdd6e8; font-size:0.85rem; cursor:pointer;">
                    <option value="debug">Debug</option>
                    <option value="info">Info</option>
                    <option value="warn" selected>Warn</option>
                    <option value="error">Error</option>
                </select>
                <button type="button" id="adv-apply-log-btn" disabled style="padding:6px 12px; width:148px; border-radius:6px; border:none; background:#3b82f6; color:#fff; cursor:not-allowed; opacity:0.45; font-size:0.82rem; margin-left:auto; text-align:center;">Apply</button>
            </div>

            <div style="margin-top:12px; padding-top:12px; border-top:1px solid #2e4068;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                    <span style="color:#cdd6e8; font-size:0.88rem; font-weight:600; white-space:nowrap;">Local AI</span>
                    <span style="color:#8fa4c8; font-size:0.82rem;">Ollama / Gemma4</span>
                    <button type="button" id="adv-start-ollama-btn" style="padding:6px 12px; border-radius:6px; border:1px solid #2e4068; background:#0f1922; color:#8fa4c8; cursor:pointer; font-size:0.82rem; margin-left:auto; white-space:nowrap;">Start Local AI</button>
                </div>
                <div id="adv-ollama-msg" style="display:none; font-size:0.82rem; margin-bottom:6px; padding:6px 8px; border-radius:4px; color:#8fa4c8;"></div>
                <div id="adv-ollama-confirm" style="display:none; gap:8px; margin-bottom:6px;">
                    <button type="button" id="adv-ollama-yes" style="padding:6px 12px; border-radius:6px; border:none; background:#3b82f6; color:#fff; cursor:pointer; font-size:0.82rem;">Yes, Download</button>
                    <button type="button" id="adv-ollama-cancel" style="padding:6px 12px; border-radius:6px; border:1px solid #2e4068; background:#0f1922; color:#8fa4c8; cursor:pointer; font-size:0.82rem;">Cancel</button>
                </div>
                <div id="adv-ollama-progress" style="display:none; font-size:0.75rem; color:#8fa4c8; max-height:56px; overflow:hidden; background:#0d151e; border:1px solid #1e3050; border-radius:4px; padding:6px 8px; font-family:monospace;"></div>
                <label style="display:flex; align-items:center; gap:8px; margin-top:10px; color:#cdd6e8; font-size:0.84rem;">
                    <input type="checkbox" id="adv-auto-start-local-ai" style="accent-color:#3b82f6;">
                    <span>Auto start Local AI</span>
                </label>
            </div>

            <div id="adv-status" style="color:#f87171; font-size:0.82rem; margin-top:12px; display:none;"></div>
        </div>

        <!-- Login panel -->
        <div class="panel active" id="panel-login">
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input id="login-username" type="text" name="username" required placeholder="Enter your username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" required placeholder="Your password" autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt" style="margin-right:6px;"></i>Sign In
                </button>
            </form>
        </div>

        <!-- Register panel -->
        <div class="panel" id="panel-register">
            <form id="register-form" autocomplete="on">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input id="reg-username" type="text" name="username" required placeholder="Choose any username" autocomplete="username">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-display-name">First Name</label>
                        <input id="reg-display-name" type="text" name="display_name" required placeholder="e.g. Jane">
                    </div>
                    <div class="form-group">
                        <label for="reg-family-name">Family Name</label>
                        <input id="reg-family-name" type="text" name="family_name" placeholder="e.g. Smith">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input id="reg-password" type="password" name="password" required placeholder="Choose a password" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="reg-password-confirm">Confirm Password</label>
                        <input id="reg-password-confirm" type="password" required placeholder="Re-enter your password" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="register-btn">
                    <i class="fas fa-user-plus" style="margin-right:6px;"></i>Register
                </button>
            </form>
        </div>

        <!-- Visitor panel -->
        <div class="panel" id="panel-visitor">
            <div class="form-group">
                <label>Access the archive with the visitor key provided by the archive owner. You do not need to enter subject name, username, or email.</label>
                <br/>
                <button type="button" id="visitor-hints-btn" style="padding:10px 14px; border-radius:6px; border:1px solid #2e4068; background:#0f1922; color:#8fa4c8; cursor:pointer; white-space:nowrap;">
                    Get Hints
                </button>
                <div id="visitor-hints-list" style="display:none; margin-top:10px; padding:10px 14px; background:#0f1922; border:1px solid #2e4068; border-radius:6px; color:#8fa4c8; font-size:0.88rem;"></div>
            </div>
            <div class="form-group">
                <label for="visitor-key">Visitor Key</label>
                <input id="visitor-key" type="password" placeholder="Enter your visitor key" autocomplete="current-password">
            </div>
            <button type="button" class="submit-btn" id="visitor-login-btn">
                <i class="fas fa-door-open" style="margin-right:6px;"></i>Access Archive
            </button>
        </div>
    </div>

    <script>
        const HAS_REGISTERED_USER = {{ has_registered_user }};
        const HAS_VISITOR_KEYS = {{ has_visitor_keys }};

        // Tab switching
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const tabVisitor = document.getElementById('tab-visitor');
        const panelLogin = document.getElementById('panel-login');
        const panelRegister = document.getElementById('panel-register');
        const panelVisitor = document.getElementById('panel-visitor');
        const errorMsg = document.getElementById('error-msg');

        function showTab(tab) {
            tabLogin.classList.toggle('active', tab === 'login');
            tabRegister.classList.toggle('active', tab === 'register');
            tabVisitor.classList.toggle('active', tab === 'visitor');
            panelLogin.classList.toggle('active', tab === 'login');
            panelRegister.classList.toggle('active', tab === 'register');
            panelVisitor.classList.toggle('active', tab === 'visitor');
            errorMsg.style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
            const adminLoginTop = document.getElementById('login-admin-login-btn');
            if (adminLoginTop) {
                const loginTabVisible = tabLogin.style.display !== 'none';
                adminLoginTop.style.display = (tab === 'login' && loginTabVisible) ? 'block' : 'none';
            }
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        tabLogin.addEventListener('click', () => showTab('login'));
        tabRegister.addEventListener('click', () => showTab('register'));
        tabVisitor.addEventListener('click', () => showTab('visitor'));

        (function wireAdminLoginTop() {
            const btn = document.getElementById('login-admin-login-btn');
            if (btn) {
                btn.addEventListener('click', function() {
                    window.location.href = '/admin';
                });
            }
        })();

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        if (HAS_REGISTERED_USER) {
            tabRegister.style.display = 'none';
            panelRegister.classList.remove('active');
            showTab('login');
        } else {
            tabLogin.style.display = 'none';
            panelLogin.classList.remove('active');
            showTab('register');
        }
        if (!HAS_VISITOR_KEYS) {
            tabVisitor.style.display = 'none';
            panelVisitor.classList.remove('active');
        }

        // Login form
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>Signing in\u2026';
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value.trim(),
                        password: document.getElementById('login-password').value
                    })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json().catch(() => ({}));
                    showError(data.error || data.detail || 'Invalid username or password.');
                }
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:6px;"></i>Sign In';
            }
        });

        // Register form
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>Registering\u2026';
            try {
                const password = document.getElementById('reg-password').value;
                const passwordConfirm = document.getElementById('reg-password-confirm').value;
                if (password !== passwordConfirm) {
                    showError('Passwords do not match.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus" style="margin-right:6px;"></i>Register';
                    return;
                }
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('reg-username').value.trim(),
                        display_name: document.getElementById('reg-display-name').value.trim(),
                        family_name: document.getElementById('reg-family-name').value.trim(),
                        password: password
                    })
                });
                if (res.ok) {
                    const registeredUsername = document.getElementById('reg-username').value.trim();
                    showTab('login');
                    document.getElementById('login-username').value = registeredUsername;
                    document.getElementById('login-password').focus();
                    showSuccess('Registration successful! Please sign in with your new account.');
                } else {
                    const data = await res.json().catch(() => ({}));
                    showError(data.error || data.detail || 'Registration failed. Please try again.');
                }
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus" style="margin-right:6px;"></i>Register';
            }
        });
        // Visitor — Get Hints
        document.getElementById('visitor-hints-btn').addEventListener('click', async function() {
            const hintsList = document.getElementById('visitor-hints-list');
            try {
                const res = await fetch('/visitor/hints', { credentials: 'same-origin' });
                const data = await res.json().catch(() => ({}));
                const hints = data.hints || [];
                if (hints.length === 0) {
                    hintsList.innerHTML = 'No hints available for this archive.';
                } else {
                    hintsList.innerHTML = '<strong style="color:#cdd6e8;">Key hints:</strong><ul style="margin:6px 0 0; padding-left:18px;">' +
                        hints.map(h => '<li>' + h.replace(/</g, '&lt;') + '</li>').join('') + '</ul>';
                }
                hintsList.style.display = 'block';
            } catch (err) {
                hintsList.innerHTML = 'Could not retrieve hints.';
                hintsList.style.display = 'block';
            }
        });

        // Visitor — Access Archive
        document.getElementById('visitor-login-btn').addEventListener('click', async function() {
            const btn = this;
            const key = document.getElementById('visitor-key').value;
            errorMsg.style.display = 'none';
            if (!key) {
                showError('Please enter your visitor key.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>Checking\u2026';
            try {
                const res = await fetch('/visitor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ key: key })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json().catch(() => ({}));
                    const status = res.status;
                    if (status === 401) {
                        showError('Invalid visitor key. Please try again.');
                    } else {
                        showError(data.error || data.detail || 'Access failed. Please try again.');
                    }
                }
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-door-open" style="margin-right:6px;"></i>Access Archive';
            }
        });
        // Advanced database selector (Electron only)
        (function () {
            const trigger = document.getElementById('advanced-trigger');
            if (!window.electronAPI) { trigger.style.display = 'none'; return; }

            let pendingPath = null;
            let currentDbPath = null;
            let originalLogLevel = 'warn';

            const applyDbBtn  = document.getElementById('adv-apply-btn');
            const applyLogBtn = document.getElementById('adv-apply-log-btn');
            const logSel      = document.getElementById('adv-log-level');
            const statusEl    = document.getElementById('adv-status');
            const autoStartLocalAICheckbox = document.getElementById('adv-auto-start-local-ai');

            function setDbBtnEnabled(on) {
                applyDbBtn.disabled = !on;
                applyDbBtn.style.cursor  = on ? 'pointer' : 'not-allowed';
                applyDbBtn.style.opacity = on ? '1' : '0.45';
            }
            function setLogBtnEnabled(on) {
                applyLogBtn.disabled = !on;
                applyLogBtn.style.cursor  = on ? 'pointer' : 'not-allowed';
                applyLogBtn.style.opacity = on ? '1' : '0.45';
            }

            const panelAdvanced = document.getElementById('panel-advanced');
            const advancedBtn = document.getElementById('advanced-btn');

            async function openAdvancedPanel() {
                panelAdvanced.style.display = 'block';
                advancedBtn.setAttribute('aria-expanded', 'true');
                document.getElementById('adv-current-path').textContent = '(loading…)';
                statusEl.style.display = 'none';
                pendingPath = null;
                setDbBtnEnabled(false);
                setLogBtnEnabled(false);
                const [p, lvl] = await Promise.all([
                    window.electronAPI.getDbPath(),
                    window.electronAPI.getLogLevel(),
                ]);
                currentDbPath = p || '';
                document.getElementById('adv-current-path').textContent = currentDbPath || '(unknown)';
                originalLogLevel = (lvl || 'warn').toLowerCase();
                logSel.value = originalLogLevel;
                if (!logSel.value) { logSel.value = 'warn'; originalLogLevel = 'warn'; }
                const autoStartEnabled = await window.electronAPI.getAutoStartLocalAI();
                autoStartLocalAICheckbox.checked = !!autoStartEnabled;
            }

            advancedBtn.addEventListener('click', async function () {
                if (panelAdvanced.style.display === 'block') {
                    panelAdvanced.style.display = 'none';
                    advancedBtn.setAttribute('aria-expanded', 'false');
                    return;
                }
                await openAdvancedPanel();
            });

            logSel.addEventListener('change', () => {
                setLogBtnEnabled(logSel.value !== originalLogLevel);
            });

            document.getElementById('adv-browse-btn').addEventListener('click', async () => {
                const result = await window.electronAPI.showOpenDialog({
                    title: 'Select Database',
                    filters: [{ name: 'SQLite Database', extensions: ['sqlite', 'db'] }],
                    properties: ['openFile'],
                });
                if (!result.canceled && result.filePaths.length > 0) {
                    pendingPath = result.filePaths[0];
                    document.getElementById('adv-current-path').textContent = pendingPath;
                    setDbBtnEnabled(true);
                }
            });

            document.getElementById('adv-new-btn').addEventListener('click', async () => {
                const result = await window.electronAPI.showSaveDialog({
                    title: 'Create New Database',
                    defaultPath: 'main.sqlite',
                    filters: [{ name: 'SQLite Database', extensions: ['sqlite', 'db'] }],
                });
                if (!result.canceled && result.filePath) {
                    pendingPath = result.filePath;
                    document.getElementById('adv-current-path').textContent = pendingPath + ' (new)';
                    setDbBtnEnabled(true);
                }
            });

            async function applySettings(dbPath, logLevel, btn, resetLabel) {
                btn.disabled = true;
                btn.style.cursor = 'not-allowed';
                btn.style.opacity = '0.45';
                btn.textContent = 'Restarting…';
                statusEl.style.display = 'none';
                const result = await window.electronAPI.selectDatabase({ path: dbPath, logLevel });
                if (result.ok) {
                    window.location.reload();
                } else {
                    statusEl.textContent = 'Error: ' + (result.error || 'unknown');
                    statusEl.style.display = 'block';
                    btn.textContent = resetLabel;
                    btn.disabled = false;
                    btn.style.cursor = 'pointer';
                    btn.style.opacity = '1';
                }
            }

            applyDbBtn.addEventListener('click', () => {
                if (!pendingPath) return;
                applySettings(pendingPath, logSel.value, applyDbBtn, 'Use This Database');
            });

            applyLogBtn.addEventListener('click', () => {
                applySettings(currentDbPath, logSel.value, applyLogBtn, 'Apply');
            });

            // ── Local AI (Ollama) ─────────────────────────────────────────────
            window.electronAPI.onOllamaPullProgress((line) => {
                const el = document.getElementById('adv-ollama-progress');
                el.style.display = 'block';
                el.textContent = line;
            });

            const ollamaMsg     = document.getElementById('adv-ollama-msg');
            const ollamaConfirm = document.getElementById('adv-ollama-confirm');
            const ollamaProgress= document.getElementById('adv-ollama-progress');
            const ollamaStartBtn= document.getElementById('adv-start-ollama-btn');

            function ollamaSetMsg(text, color) {
                ollamaMsg.textContent = text;
                ollamaMsg.style.color = color || '#8fa4c8';
                ollamaMsg.style.display = 'block';
            }

            async function doStartOllama() {
                ollamaSetMsg('Starting Ollama server…');
                const res = await window.electronAPI.startOllama();
                if (!res.ok) {
                    ollamaSetMsg('Failed to start Ollama: ' + (res.error || 'unknown'), '#f87171');
                    ollamaStartBtn.disabled = false;
                    return;
                }
                ollamaSetMsg('✓ Local AI (Ollama / Gemma4) is running — you may now sign in.', '#4ade80');
                ollamaStartBtn.textContent = '✓ Running';
            }

            document.getElementById('adv-ollama-yes').addEventListener('click', async () => {
                ollamaConfirm.style.display = 'none';
                ollamaProgress.style.display = 'block';
                ollamaProgress.textContent = '';
                ollamaSetMsg('Downloading Gemma4 model — this may take several minutes…');
                const res = await window.electronAPI.pullOllamaModel();
                if (!res.ok) {
                    ollamaSetMsg('Download failed: ' + (res.error || 'unknown'), '#f87171');
                    ollamaStartBtn.disabled = false;
                    return;
                }
                ollamaProgress.style.display = 'none';
                await doStartOllama();
            });

            document.getElementById('adv-ollama-cancel').addEventListener('click', () => {
                ollamaConfirm.style.display = 'none';
                ollamaMsg.style.display = 'none';
                ollamaStartBtn.disabled = false;
            });

            ollamaStartBtn.addEventListener('click', async () => {
                ollamaStartBtn.disabled = true;
                ollamaConfirm.style.display = 'none';
                ollamaProgress.style.display = 'none';
                ollamaSetMsg('Checking for Gemma4 model…');
                const check = await window.electronAPI.checkOllamaModel();
                if (!check.ok) {
                    ollamaSetMsg('Error: ' + check.error, '#f87171');
                    ollamaStartBtn.disabled = false;
                    return;
                }
                if (!check.hasModel) {
                    ollamaSetMsg('Gemma4 model not found. Download it now? (Several GB — may take a few minutes.)', '#fbbf24');
                    ollamaConfirm.style.display = 'flex';
                    return;
                }
                await doStartOllama();
            });

            autoStartLocalAICheckbox.addEventListener('change', async () => {
                const result = await window.electronAPI.setAutoStartLocalAI(autoStartLocalAICheckbox.checked);
                if (!result.ok) {
                    autoStartLocalAICheckbox.checked = !autoStartLocalAICheckbox.checked;
                    ollamaSetMsg('Failed to save Auto start Local AI: ' + (result.error || 'unknown'), '#f87171');
                    return;
                }
                ollamaSetMsg(
                    autoStartLocalAICheckbox.checked
                        ? 'Auto start Local AI enabled. Ollama will start automatically on app launch.'
                        : 'Auto start Local AI disabled.',
                    '#8fa4c8'
                );
            });
        }());
    </script>
</body>
</html>
