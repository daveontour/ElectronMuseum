# Loaded when `npx electron-builder` runs from `electron/` (see Makefile `electron-dist`).
# Paths in `extraResources.from` are relative to this folder (the app project dir).
appId: com.digitalmuseum.app
productName: Digital Museum

directories:
  output: ../dist/electron

# Custom icons: add electron/build/icon.ico (multi-size .ico), then set win.icon + nsis installer/uninstaller icons.
win:
  target: nsis
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

files:
  - main.js
  - preload.js
  - loading.html
  - package.json
  - tray-icon.png

extraResources:
  - from: ../bin/digitalmuseum.exe
    to: bin/digitalmuseum.exe
  - from: ../bin/ImageMagick
    to: bin/ImageMagick
    filter:
      - "**/*"
  - from: ../bin/Ollama
    to: bin/Ollama
    filter:
      - "**/*"
  - from: ../templates
    to: templates
    filter:
      - "**/*"
  - from: ../static
    to: static
    filter:
      - "**/*"
  - from: .env
    to: .env

asar: true
